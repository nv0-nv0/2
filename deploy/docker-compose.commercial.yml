# NV0 commercial compose - R2 primary production profile
# Use this file only for manual/docker-compose deployments.
# Coolify canonical file remains /docker-compose.yml.
# CI contract marker: NV0_PLATFORM_TARGET=commercial

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - ./env.commercial.template
    environment:
      NV0_PLATFORM_TARGET: commercial
      NV0_PERSISTENCE_MODE: postgres_primary
      NV0_SESSION_STORE: redis
      NV0_RATE_LIMIT_STORE: redis
      NV0_LOCK_PROVIDER: redis
      NV0_STORAGE_MODE: s3
      NV0_SLOW_REQUEST_THRESHOLD_MS: ${NV0_SLOW_REQUEST_THRESHOLD_MS:-1500}
      NV0_DATA_DESTRUCTION_GRACE_DAYS: ${NV0_DATA_DESTRUCTION_GRACE_DAYS:-30}
      NV0_DATABASE_URL: postgres://nv0:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/nv0
      NV0_REDIS_URL: redis://redis:6379/0
      NV0_S3_ENDPOINT: ${NV0_S3_ENDPOINT:?set NV0_S3_ENDPOINT}
      NV0_S3_BUCKET: ${NV0_S3_BUCKET:?set NV0_S3_BUCKET}
      NV0_S3_REGION: ${NV0_S3_REGION:-auto}
      NV0_S3_ACCESS_KEY_ID: ${NV0_S3_ACCESS_KEY_ID:?set NV0_S3_ACCESS_KEY_ID}
      NV0_S3_SECRET_ACCESS_KEY: ${NV0_S3_SECRET_ACCESS_KEY:?set NV0_S3_SECRET_ACCESS_KEY}
      NV0_S3_PUBLIC_BASE_URL: ${NV0_S3_PUBLIC_BASE_URL:-}
      NV0_S3_FORCE_PATH_STYLE: ${NV0_S3_FORCE_PATH_STYLE:-true}
    ports:
      - "${APP_PORT:-3210}:3210"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_DB: nv0
      POSTGRES_USER: nv0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nv0 -d nv0"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
