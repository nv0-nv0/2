# NV0_PLATFORM_TARGET=commercial
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env.commercial.template
    environment:
      NV0_PLATFORM_TARGET: commercial
      NV0_PERSISTENCE_MODE: postgres_primary
      NV0_SESSION_STORE: redis
      NV0_RATE_LIMIT_STORE: redis
      NV0_LOCK_PROVIDER: redis
      NV0_STORAGE_MODE: s3
      NV0_DATABASE_URL: postgres://nv0:${POSTGRES_PASSWORD:-replace_me}@postgres:5432/nv0
      NV0_REDIS_URL: redis://redis:6379
      NV0_S3_ENDPOINT: http://minio:9000
      NV0_S3_BUCKET: nv0-assets
      NV0_S3_REGION: ap-northeast-2
      NV0_S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3210:3210"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nv0
      POSTGRES_USER: nv0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nv0 -d nv0"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NV0_S3_ACCESS_KEY_ID:-replace_me}
      MINIO_ROOT_PASSWORD: ${NV0_S3_SECRET_ACCESS_KEY:-replace_me_min_8_chars}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
