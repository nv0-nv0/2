# VERIDION Coolify boot-safe compose - fail-closed availability guard
# Coolify settings:
# - Build Pack: Docker Compose
# - Base Directory: /
# - Docker Compose Location: /deploy/docker-compose.coolify.yml
# This file intentionally boots without mandatory external services. Use deploy/docker-compose.commercial.yml after live availability is confirmed.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3210}
      NV0_RUNTIME_DIR: ${NV0_RUNTIME_DIR:-/tmp/nv0-runtime}
      NV0_FALLBACK_RUNTIME_DIR: ${NV0_FALLBACK_RUNTIME_DIR:-/tmp/nv0-runtime}
      NV0_REQUIRE_PERSISTENT_RUNTIME: ${NV0_REQUIRE_PERSISTENT_RUNTIME:-false}
      NV0_PLATFORM_TARGET: ${NV0_PLATFORM_TARGET:-mvp}
      NV0_DEPLOYMENT_STAGE: ${NV0_DEPLOYMENT_STAGE:-mvp}
      NV0_COMMERCIAL_LAUNCH_READY: ${NV0_COMMERCIAL_LAUNCH_READY:-false}
      NV0_RUN_PREFLIGHT: ${NV0_RUN_PREFLIGHT:-false}
      NV0_PUBLIC_BASE_URL: ${NV0_PUBLIC_BASE_URL:-https://nv0.kr}
      NV0_TRUST_PROXY_HEADERS: ${NV0_TRUST_PROXY_HEADERS:-true}
      NV0_ALLOWED_ADMIN_ORIGINS: ${NV0_ALLOWED_ADMIN_ORIGINS:-nv0.kr,www.nv0.kr,localhost,127.0.0.1}
      NV0_ALLOWED_HOSTS: ${NV0_ALLOWED_HOSTS:-nv0.kr,www.nv0.kr,localhost,127.0.0.1,0.0.0.0,::1}
      NV0_CANONICAL_HOST_REDIRECT: ${NV0_CANONICAL_HOST_REDIRECT:-false}
      NV0_EXPOSE_INTERNAL_PUBLIC_APIS: ${NV0_EXPOSE_INTERNAL_PUBLIC_APIS:-false}
      NV0_REDIRECT_OWNER: ${NV0_REDIRECT_OWNER:-edge}
      NV0_DEPLOYMENT_RISK_STRICT: ${NV0_DEPLOYMENT_RISK_STRICT:-false}
      NV0_BUILD_VERSION: ${NV0_BUILD_VERSION:-}
      NV0_BUILD_TIME: ${NV0_BUILD_TIME:-}
      NV0_COMMIT_SHA: ${NV0_COMMIT_SHA:-}
      NV0_RELEASE_ID: ${NV0_RELEASE_ID:-}
      NV0_REQUEST_TIMEOUT_MS: ${NV0_REQUEST_TIMEOUT_MS:-15000}
      NV0_SLOW_REQUEST_THRESHOLD_MS: ${NV0_SLOW_REQUEST_THRESHOLD_MS:-1500}
      NV0_LOG_HEALTHCHECK_REQUESTS: ${NV0_LOG_HEALTHCHECK_REQUESTS:-false}
      NV0_LOG_FAVICON_REQUESTS: ${NV0_LOG_FAVICON_REQUESTS:-false}
      NV0_HEALTHZ_STRICT: ${NV0_HEALTHZ_STRICT:-false}
      NV0_READYZ_CACHE_TTL_MS: ${NV0_READYZ_CACHE_TTL_MS:-3000}
      NV0_MAX_JSON_BODY_BYTES: ${NV0_MAX_JSON_BODY_BYTES:-1048576}
      NV0_MAX_MULTIPART_BODY_BYTES: ${NV0_MAX_MULTIPART_BODY_BYTES:-10485760}
      NV0_ADMIN_AUTH_MODE: ${NV0_ADMIN_AUTH_MODE:-shared_key}
      NV0_ADMIN_MFA_REQUIRED: ${NV0_ADMIN_MFA_REQUIRED:-false}
      NV0_ADMIN_TOTP_SECRET: ${NV0_ADMIN_TOTP_SECRET:-}
      NV0_SESSION_SECRET: ${NV0_SESSION_SECRET:-}
      NV0_ADMIN_AUTH_LIMIT: ${NV0_ADMIN_AUTH_LIMIT:-8}
      NV0_ADMIN_AUTH_WINDOW_MS: ${NV0_ADMIN_AUTH_WINDOW_MS:-600000}
      # NV0_ADMIN_KEY is intentionally not injected by boot-safe compose.
      # In commercial/prelaunch use account_rbac; legacy shared-key admin is MVP-only.
      NV0_BOOTSTRAP_ADMIN_EMAIL: ${NV0_BOOTSTRAP_ADMIN_EMAIL:-}
      NV0_BOOTSTRAP_ADMIN_NAME: ${NV0_BOOTSTRAP_ADMIN_NAME:-VERIDION_Admin}
      NV0_BOOTSTRAP_ADMIN_PASSWORD: ${NV0_BOOTSTRAP_ADMIN_PASSWORD:-}
      NV0_ADMIN_SESSION_TTL_MS: ${NV0_ADMIN_SESSION_TTL_MS:-3600000}
      NV0_ADMIN_IP_ALLOWLIST: ${NV0_ADMIN_IP_ALLOWLIST:-}
      NV0_ENABLE_TURNSTILE: ${NV0_ENABLE_TURNSTILE:-false}
      NV0_TURNSTILE_SITE_KEY: ${NV0_TURNSTILE_SITE_KEY:-}
      NV0_TURNSTILE_SECRET: ${NV0_TURNSTILE_SECRET:-}
      NV0_PERSISTENCE_MODE: ${NV0_PERSISTENCE_MODE:-json}
      NV0_SESSION_STORE: ${NV0_SESSION_STORE:-file}
      NV0_RATE_LIMIT_STORE: ${NV0_RATE_LIMIT_STORE:-memory}
      NV0_LOCK_PROVIDER: ${NV0_LOCK_PROVIDER:-memory}
      NV0_DATABASE_URL: ${NV0_DATABASE_URL:-}
      NV0_PRELAUNCH_DB_FALLBACK: ${NV0_PRELAUNCH_DB_FALLBACK:-true}
      NV0_DB_COMPARE_MODE: ${NV0_DB_COMPARE_MODE:-0}
      NV0_REDIS_URL: ${NV0_REDIS_URL:-}
      NV0_REDIS_TIMEOUT_MS: ${NV0_REDIS_TIMEOUT_MS:-1500}
      NV0_STORAGE_MODE: ${NV0_STORAGE_MODE:-local_fs}
      NV0_SCAN_PROVIDER: ${NV0_SCAN_PROVIDER:-builtin}
      NV0_SCAN_PROVIDER_FALLBACK: ${NV0_SCAN_PROVIDER_FALLBACK:-true}
      NV0_TARGET_FETCH_ENABLED: ${NV0_TARGET_FETCH_ENABLED:-true}
      NV0_S3_ENDPOINT: ${NV0_S3_ENDPOINT:-}
      NV0_S3_BUCKET: ${NV0_S3_BUCKET:-}
      NV0_S3_REGION: ${NV0_S3_REGION:-auto}
      NV0_S3_ACCESS_KEY_ID: ${NV0_S3_ACCESS_KEY_ID:-}
      NV0_S3_SECRET_ACCESS_KEY: ${NV0_S3_SECRET_ACCESS_KEY:-}
      NV0_S3_PUBLIC_BASE_URL: ${NV0_S3_PUBLIC_BASE_URL:-}
      NV0_S3_FORCE_PATH_STYLE: ${NV0_S3_FORCE_PATH_STYLE:-true}
      NV0_SCAN_PROVIDER_URL: ${NV0_SCAN_PROVIDER_URL:-}
      NV0_SCAN_PROVIDER_TOKEN: ${NV0_SCAN_PROVIDER_TOKEN:-}
      NV0_SCAN_CACHE_TTL_MS: ${NV0_SCAN_CACHE_TTL_MS:-300000}
      NV0_SCAN_SOFT_TIMEOUT_MS: ${NV0_SCAN_SOFT_TIMEOUT_MS:-6500}
      NV0_PUBLIC_DEMO_FORCE_SCAN_FALLBACK: ${NV0_PUBLIC_DEMO_FORCE_SCAN_FALLBACK:-true}
      NV0_PUBLIC_SCAN_LIMIT: ${NV0_PUBLIC_SCAN_LIMIT:-20}
      NV0_PUBLIC_SCAN_WINDOW_MS: ${NV0_PUBLIC_SCAN_WINDOW_MS:-60000}
      NV0_TARGET_FETCH_MAX_PAGES: ${NV0_TARGET_FETCH_MAX_PAGES:-12}
      NV0_TARGET_FETCH_CONCURRENCY: ${NV0_TARGET_FETCH_CONCURRENCY:-4}
      NV0_TARGET_FETCH_TIMEOUT_MS: ${NV0_TARGET_FETCH_TIMEOUT_MS:-3000}
      NV0_TARGET_FETCH_MAX_BYTES: ${NV0_TARGET_FETCH_MAX_BYTES:-524288}
      NV0_TARGET_FETCH_MAX_REDIRECTS: ${NV0_TARGET_FETCH_MAX_REDIRECTS:-3}
      NV0_TARGET_FETCH_ROBOTS_ENABLED: ${NV0_TARGET_FETCH_ROBOTS_ENABLED:-true}
      NV0_TARGET_FETCH_SITEMAP_ENABLED: ${NV0_TARGET_FETCH_SITEMAP_ENABLED:-true}
      NV0_TARGET_FETCH_MAX_SITEMAP_URLS: ${NV0_TARGET_FETCH_MAX_SITEMAP_URLS:-40}
      NV0_TARGET_FETCH_MAX_DISCOVERY_RESOURCES: ${NV0_TARGET_FETCH_MAX_DISCOVERY_RESOURCES:-4}
      NV0_TARGET_FETCH_AUTOMATION_LEVEL: ${NV0_TARGET_FETCH_AUTOMATION_LEVEL:-maximum_free_safe}
      NV0_PAYMENT_PROVIDER: ${NV0_PAYMENT_PROVIDER:-disabled}
      NV0_PAYMENT_PROVIDER_URL: ${NV0_PAYMENT_PROVIDER_URL:-}
      NV0_PAYMENT_PROVIDER_TOKEN: ${NV0_PAYMENT_PROVIDER_TOKEN:-}
      NV0_PORTONE_WEBHOOK_VERIFY_MODE: ${NV0_PORTONE_WEBHOOK_VERIFY_MODE:-optional}
      NV0_PAYMENT_REDIRECT_ALLOWED_HOSTS: ${NV0_PAYMENT_REDIRECT_ALLOWED_HOSTS:-}
      NV0_ALLOW_PRELAUNCH_ONLINE_PAYMENT: ${NV0_ALLOW_PRELAUNCH_ONLINE_PAYMENT:-false}
      NV0_PORTONE_API_BASE_URL: ${NV0_PORTONE_API_BASE_URL:-https://api.portone.io}
      NV0_PORTONE_API_SECRET: ${NV0_PORTONE_API_SECRET:-}
      NV0_PORTONE_STORE_ID: ${NV0_PORTONE_STORE_ID:-}
      NV0_PORTONE_CHANNEL_KEY: ${NV0_PORTONE_CHANNEL_KEY:-}
      NV0_PORTONE_REDIRECT_URL: ${NV0_PORTONE_REDIRECT_URL:-https://nv0.kr/checkout}
      NV0_PORTONE_PAY_METHOD: ${NV0_PORTONE_PAY_METHOD:-CARD}
      NV0_PORTONE_CUSTOMER_ID_PREFIX: ${NV0_PORTONE_CUSTOMER_ID_PREFIX:-nv0}
      NV0_PORTONE_WEBHOOK_SECRET: ${NV0_PORTONE_WEBHOOK_SECRET:-}
      NV0_SUPPORT_EMAIL: ${NV0_SUPPORT_EMAIL:-ct@nv0.kr}
      NV0_PRIVACY_OFFICER_EMAIL: ${NV0_PRIVACY_OFFICER_EMAIL:-ct@nv0.kr}
      NV0_OPERATOR_ALERT_EMAIL: ${NV0_OPERATOR_ALERT_EMAIL:-ct@nv0.kr}
      NV0_DATA_RETENTION_DAYS: ${NV0_DATA_RETENTION_DAYS:-90}
      NV0_DATA_DESTRUCTION_GRACE_DAYS: ${NV0_DATA_DESTRUCTION_GRACE_DAYS:-30}
      NV0_REFUND_REQUEST_WINDOW_DAYS: ${NV0_REFUND_REQUEST_WINDOW_DAYS:-7}
      NV0_RULES_VERSION: ${NV0_RULES_VERSION:-production-20260427}
      NV0_LEGAL_EVIDENCE_VERSION: ${NV0_LEGAL_EVIDENCE_VERSION:-legal-evidence-v1}
      NV0_PRIVACY_POLICY_VERSION: ${NV0_PRIVACY_POLICY_VERSION:-}
      NV0_TERMS_VERSION: ${NV0_TERMS_VERSION:-}
      NV0_REFUND_POLICY_VERSION: ${NV0_REFUND_POLICY_VERSION:-}
      NV0_HOSTING_PROVIDER: ${NV0_HOSTING_PROVIDER:-Coolify/Contabo}
      NV0_CUSTOMER_SERVICE_PHONE: ${NV0_CUSTOMER_SERVICE_PHONE:-이메일전용고객지원}
      NV0_SMTP_URL: ${NV0_SMTP_URL:-}
      NV0_EMAIL_FROM: ${NV0_EMAIL_FROM:-}
      NV0_EMAIL_MAX_RETRY_COUNT: ${NV0_EMAIL_MAX_RETRY_COUNT:-5}
      NV0_EMAIL_RETRY_BACKOFF_MS: ${NV0_EMAIL_RETRY_BACKOFF_MS:-300000}
      NV0_SECURE_RECORDS_KEY: ${NV0_SECURE_RECORDS_KEY:-}
      NV0_SECURE_RECORDS_SALT: ${NV0_SECURE_RECORDS_SALT:-nv0-secure-record-store-v1}
      NV0_SECURE_RECORDS_DIR: ${NV0_SECURE_RECORDS_DIR:-/tmp/nv0-runtime/data/secure-records}
      NV0_PRIVACY_HASH_KEY: ${NV0_PRIVACY_HASH_KEY:-}
      NV0_BUSINESS_TRADE_NAME: ${NV0_BUSINESS_TRADE_NAME:-}
      NV0_BUSINESS_REPRESENTATIVE: ${NV0_BUSINESS_REPRESENTATIVE:-}
      NV0_BUSINESS_REGISTRATION_NUMBER: ${NV0_BUSINESS_REGISTRATION_NUMBER:-}
      NV0_BUSINESS_ADDRESS: ${NV0_BUSINESS_ADDRESS:-}
      NV0_MAIL_ORDER_REGISTRATION_NUMBER: ${NV0_MAIL_ORDER_REGISTRATION_NUMBER:-}
      NV0_BACKUP_RETENTION_COUNT: ${NV0_BACKUP_RETENTION_COUNT:-20}
      NV0_BACKUP_REMOTE_ENABLED: ${NV0_BACKUP_REMOTE_ENABLED:-true}
      NV0_BACKUP_REMOTE_PREFIX: ${NV0_BACKUP_REMOTE_PREFIX:-backups/nv0}
      NV0_BACKUP_COMPRESS: ${NV0_BACKUP_COMPRESS:-true}
      NV0_BACKUP_ENCRYPTION_SECRET: ${NV0_BACKUP_ENCRYPTION_SECRET:-}
      NV0_BACKUP_REMOTE_REQUIRE_ENCRYPTION: ${NV0_BACKUP_REMOTE_REQUIRE_ENCRYPTION:-true}
      NV0_AUTO_BACKUP_ENABLED: ${NV0_AUTO_BACKUP_ENABLED:-true}
      NV0_AUTO_BACKUP_ON_STARTUP: ${NV0_AUTO_BACKUP_ON_STARTUP:-true}
      NV0_AUTO_BACKUP_INTERVAL_MS: ${NV0_AUTO_BACKUP_INTERVAL_MS:-21600000}
      NV0_AUDIT_LOG_RETENTION_COUNT: ${NV0_AUDIT_LOG_RETENTION_COUNT:-1000}
      NV0_PAYMENT_IDEMPOTENCY_TTL_MS: ${NV0_PAYMENT_IDEMPOTENCY_TTL_MS:-86400000}
      NV0_PUBLIC_CACHE_SECONDS: ${NV0_PUBLIC_CACHE_SECONDS:-60}
      NV0_PUBLIC_ASSET_CACHE_SECONDS: ${NV0_PUBLIC_ASSET_CACHE_SECONDS:-60}
      NV0_CTA_AUTOPUBLISH_INTERVAL_MS: ${NV0_CTA_AUTOPUBLISH_INTERVAL_MS:-1200000}
      NV0_READYZ_REDIS_STRICT: ${NV0_READYZ_REDIS_STRICT:-false}
      NV0_ACCESS_LOG_MODE: ${NV0_ACCESS_LOG_MODE:-normal}
      NV0_AI_REVIEW_PROVIDER: ${NV0_AI_REVIEW_PROVIDER:-disabled}
      NV0_GEMINI_API_KEY: ${NV0_GEMINI_API_KEY:-}
      NV0_GEMINI_MODEL: ${NV0_GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "${APP_PORT:-3210}:3210"
    expose:
      - "3210"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/healthz').then(async r=>{const b=await r.json().catch(()=>({}));process.exit(r.ok&&b.ok===true?0:1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 45s
