<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="NV0 관리자 진단에서 배포 상태, 연동 상태, 운영 점검 결과와 장애 대응을 확인합니다."><title>운영 진단 | NV0 Admin</title><link rel="canonical" href="https://nv0.kr/admin/diagnostics"><link rel="stylesheet" href="/shared/base.css"><link rel="stylesheet" href="/apps/admin/diagnostics/app.css"><link rel="stylesheet" href="/shared/visibility.css"></head><body><main class="app-shell"><header class="page-head"><div><div class="pill">Admin App</div><h1>운영 진단</h1><p>배포 전 상태, 이메일 큐, 백업, 런타임 정리를 한 화면에서 확인합니다.</p></div></header><!--ADMIN_NAV--><section class="grid cols-3 ops-cards" id="opsCards"><article class="card stack"><span class="pill">릴리즈</span><strong id="readyBadge">확인 중</strong><small class="muted">포트원 결제와 통신판매업 신고번호는 현재 제외 항목으로 분리합니다.</small></article><article class="card stack"><span class="pill">이메일 큐</span><strong id="emailBadge">확인 중</strong><small class="muted">SMTP 연결 후 큐 처리 버튼으로 실발송 검증이 가능합니다.</small></article><article class="card stack"><span class="pill">스캔/저장소</span><strong id="integrationBadge">확인 중</strong><small class="muted">외부 스캔 공급자와 R2/S3 설정 상태를 표시합니다.</small></article></section><section class="grid cols-2"><div class="card stack"><h2>운영 액션</h2><button type="button" id="backupBtn">백업 생성</button><button type="button" id="opsReportBtn">운영 리포트 생성</button><button type="button" id="selfTestBtn">운영 자가검수 큐 생성</button><button type="button" id="emailDryRunBtn" class="secondary">이메일 큐 미리보기</button><button type="button" id="emailLiveBtn" class="secondary">SMTP 큐 실처리</button><button type="button" id="pruneBtn" class="secondary">백업 정리</button><div id="diagState" class="notice muted">운영 진단 작업을 선택하세요. 실행 전에는 릴리즈 준비상태와 이메일 큐를 먼저 확인하세요.</div><div id="checkList" class="stack mini-checks"></div></div><div class="card"><pre id="diagOut">진단 결과가 이 영역에 표시됩니다.</pre></div></section></main><script src="/shared/safe-dom.js"></script><script type="module" src="/apps/admin/diagnostics/app.js"></script></body></html>
