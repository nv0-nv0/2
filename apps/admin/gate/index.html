<main id="main" tabindex="-1" class="app-shell admin-clean-v311 vr-admin-login-shell"><section class="vr-admin-login-brand"><span class="vr-kicker">VERIDION 관리자 보안 게이트</span><h1>관리자 로그인</h1><p>고객 진단 이력과 주문 정보를 보호하기 위해 승인된 담당자만 접근할 수 있습니다.</p><ul><li>계정 기반 권한 관리</li><li>로그인 시도 제한</li><li>선택형 2차 인증</li></ul></section><section class="card stack vr-card vr-admin-login-card" aria-labelledby="adminLoginTitle"><div><span class="pill">관리자 전용</span><h2 id="adminLoginTitle">보안 인증</h2><p class="muted" id="authModeHelp">인증 방식을 확인하고 있습니다.</p></div><form id="adminLoginForm" class="vr-form" novalidate><div id="accountFields"><label>관리자 이메일<input id="adminEmail" type="email" autocomplete="username" inputmode="email"/></label><label>비밀번호<input id="adminPassword" type="password" autocomplete="current-password"/></label><label id="otpField" hidden>일회용 인증번호<input id="adminOtp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6자리 숫자"/></label></div><div id="legacyKeyField" hidden><label>레거시 관리자 키<input id="adminKey" type="password" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/></label></div><input id="turnstileToken" type="hidden" value=""/><div class="turnstile-box hidden" id="turnstileBox"></div><div id="turnstileState" class="notice muted" role="status" aria-live="polite">추가 보안 확인을 준비하고 있습니다.</div><button type="submit" id="loginBtn" class="vr-button primary">관리자 화면 열기</button><div id="gateState" class="notice muted" role="status" aria-live="polite">인증 정보를 입력하세요.</div></form></section></main>
