<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings</title><link rel="stylesheet" href="/shared/base.css"><link rel="stylesheet" href="/apps/admin/settings/app.css"></head><body><main class="app-shell"><header class="page-head"><div><div class="pill">Admin App</div><h1>설정</h1></div></header><!--ADMIN_NAV--><section class="card stack"><label><input id="ctaAutopublishEnabled" type="checkbox" class="checkbox-inline"> 자동 발행</label><label><input id="legalWatchEnabled" type="checkbox" class="checkbox-inline"> 법령 변경 감시</label><label>자동수정 모드<select id="autoFixMode"><option value="approval_required">approval_required</option><option value="manual_only">manual_only</option></select></label><label>기본 관할<select id="defaultJurisdiction"><option value="KR">KR</option></select></label><label>알림 채널<select id="defaultAlertChannel"><option value="email">email</option><option value="dashboard">dashboard</option></select></label><label>운영 메일<input id="supportEmail" autocomplete="off"></label><div class="grid cols-3"><label>스캔 공급자<input id="scanProviderMode" disabled></label><label>결제 공급자<input id="paymentProviderMode" disabled></label><label>스토리지 모드<input id="storageMode" disabled></label></div><button id="saveSettingsBtn">설정 저장</button><pre id="settingsState">ready</pre></section></main><script type="module" src="/apps/admin/settings/app.js"></script></body></html>
