<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library</title><link rel="stylesheet" href="/shared/base.css"><link rel="stylesheet" href="/apps/admin/library/app.css"><link rel="stylesheet" href="/shared/visibility.css"></head><body><main class="app-shell"><header class="page-head"><div><div class="pill">Admin App</div><h1>자료실</h1></div></header><!--ADMIN_NAV--><section class="grid cols-2"><div class="card stack"><label>글 제목<input id="postTitle" autocomplete="off"></label><label>본문<textarea id="postBody"></textarea></label><button id="postBtn">글 등록</button></div><div class="card stack"><label>파일 제목<input id="fileTitle" autocomplete="off"></label><label>파일 업로드<input id="fileInput" type="file"></label><button id="uploadBtn">업로드</button></div></section><section class="grid cols-2"><div class="card stack"><h3>자료실 글 / 파일</h3><div id="libraryList" class="stack muted">자료실 데이터를 불러오는 중입니다. 글과 업로드 파일을 한 번에 확인합니다.</div></div><div class="card stack"><h3>공개 콘텐츠 반영</h3><div id="libraryFeed" class="stack muted">공개 콘텐츠 반영 상태를 불러오는 중입니다.</div></div></section><section class="card"><pre id="libraryState">자료실 관리 준비 완료. 제목, 본문, 파일을 확인한 뒤 등록하세요.</pre></section></main><script type="module" src="/apps/admin/library/app.js"></script></body></html>
