<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout</title><link rel="stylesheet" href="/shared/base.css"><link rel="stylesheet" href="/apps/public/checkout/app.css"></head><body><main class="app-shell"><header class="page-head"><div><div class="pill">Public App</div><h1>구독 신청</h1><p class="muted">플랜 선택 → 주문 생성 → 결제 완료 → 포털 진입까지 한 번에 이어집니다.</p></div></header><section class="grid cols-2"><div class="card stack"><div id="checkoutTarget" class="notice muted">연결된 사이트 정보를 불러오는 중...</div><label>담당자 이름<input id="buyerName" autocomplete="off" placeholder="홍길동"></label><label>담당자 이메일<input id="buyerEmail" autocomplete="off" placeholder="owner@example.com"></label><label>선택 플랜<select id="plan"><option>Basic</option><option selected>Pro</option><option>Auto</option></select></label><div class="topnav"><button id="checkoutBtn">주문 생성</button><button class="secondary" id="completeBtn" type="button">가상 결제 완료</button></div><div id="checkoutState" class="notice muted">주문 생성 전 단계입니다.</div></div><div class="card stack"><div id="orderSummary" class="muted">주문 대기 중</div><div class="topnav"><a href="/plans">플랜 다시 보기</a><a href="/portal">고객 포털</a></div></div></section></main><script src="https://cdn.portone.io/v2/browser-sdk.js"></script><script type="module" src="/apps/public/checkout/app.js"></script></body></html>
