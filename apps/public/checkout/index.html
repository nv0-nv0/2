<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>서비스 신청 | NV0</title><link rel="stylesheet" href="/shared/base.css"><link rel="stylesheet" href="/apps/public/checkout/app.css"></head><body><main class="app-shell"><header class="page-head"><div><div class="pill">서비스 신청</div><h1>필요한 서비스 선택</h1><p>무료 진단 결과를 기준으로 필요한 서비스만 선택하세요. 결제와 산출물 전달에 필요한 정보만 사용합니다.</p></div></header><section class="grid cols-2"><div class="card stack"><div id="checkoutTarget" class="notice muted">선택한 서비스와 결과물을 받을 이메일을 확인한 뒤 결제로 이동합니다.</div><label>결제·산출물 수신 이메일<input id="buyerEmail" type="email" autocomplete="email" placeholder="owner@example.com"></label><p class="notice muted">로그인 상태라면 계정 이메일을 사용할 수 있습니다. 기본 결제 과정에서는 이름, 전화번호, 주소를 받지 않습니다.</p><div class="consent-box"><label class="checkline"><input id="privacyConsent" class="checkbox-inline" type="checkbox" required> <span><a href="/privacy" target="_blank" rel="noreferrer">개인정보처리방침</a>에 동의합니다.</span></label><label class="checkline"><input id="termsConsent" class="checkbox-inline" type="checkbox" required> <span><a href="/terms" target="_blank" rel="noreferrer">이용약관</a>에 동의합니다.</span></label><label class="checkline"><input id="refundConsent" class="checkbox-inline" type="checkbox" required> <span><a href="/refund" target="_blank" rel="noreferrer">환불·배송·교환 정책</a>에 동의합니다.</span></label><label class="checkline"><input id="deliveryConsent" class="checkbox-inline" type="checkbox" required> <span>디지털 산출물 제공이 시작되면 청약철회가 제한될 수 있음을 확인합니다.</span></label></div><label>선택 상품<select id="plan"><option value="Report">간단 리포트</option><option value="Pro" selected>상세 리포트</option><option value="FixPack">수정 문구안</option><option value="TemplatePack">문서 템플릿</option><option value="IndustryGuide">업종별 가이드</option><option value="Auto">정기 점검</option><option value="Agency">대행사 패키지</option></select></label><div class="topnav"><button id="checkoutBtn">결제하기</button><button class="secondary" id="completeBtn" type="button">결제 완료 확인</button></div><div id="checkoutState" class="notice muted">결제 전 동의 항목과 수신 이메일을 확인해 주세요.</div></div><div class="card stack"><div id="orderSummary" class="muted">신청 정보와 결제 상태가 여기에 표시됩니다.</div><div class="topnav"><a href="/plans">상품 다시 보기</a><a href="/portal">내 사이트 관리</a></div></div></section></main><script src="https://cdn.portone.io/v2/browser-sdk.js"></script><script type="module" src="/apps/public/checkout/app.js"></script></body></html>
