<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Veridion Demo</title><link rel="stylesheet" href="/shared/base.css"><link rel="stylesheet" href="/apps/public/veridion-demo/app.css"></head><body><main class="app-shell"><header class="page-head"><div><div class="pill">Public App</div><h1>Veridion 전용 데모</h1><p class="muted">URL을 입력하면 위반 요소 수, 위험도 점수, 예상 최대 과태료, 상위 위험 항목을 즉시 분석합니다.</p></div></header><section class="grid cols-2"><div class="card stack"><label>Veridion 스캔 URL<input id="targetUrl" placeholder="https://your-store.example" autocomplete="off"></label><input id="turnstileToken" type="hidden" value=""><div class="turnstile-box hidden" id="turnstileBox"></div><div id="turnstileState" class="notice muted">Turnstile 설정 확인 중...</div><button id="scanBtn">Veridion 스캔 실행</button><button class="secondary" id="retryBtn">재시도</button><div id="demoState" class="notice muted">법률 컴플라이언스 분석 전용 흐름입니다.</div></div><div class="card stack"><div id="demoResult" class="muted">결과 대기 중</div><div class="topnav"><a href="/plans">추천 플랜</a><a href="/checkout">결제 이동</a><a href="/portal">고객 포털</a></div></div></section></main><script type="module" src="/apps/public/veridion-demo/app.js"></script></body></html>
