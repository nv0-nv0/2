# NV0 Coolify auto-detect compose file
# Coolify 설정:
# - Build Pack: Docker Compose
# - Base Directory: /
# - Docker Compose Location: /docker-compose.yml
# - 실제 비밀키는 Coolify Environment Variables에 등록하세요.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3210}
      NV0_PLATFORM_TARGET: ${NV0_PLATFORM_TARGET:-commercial}
      NV0_PUBLIC_BASE_URL: ${NV0_PUBLIC_BASE_URL:-https://nv0.kr}
      NV0_TRUST_PROXY_HEADERS: ${NV0_TRUST_PROXY_HEADERS:-true}
      NV0_ALLOWED_ADMIN_ORIGINS: ${NV0_ALLOWED_ADMIN_ORIGINS:-nv0.kr,www.nv0.kr}
      NV0_SUPPORT_EMAIL: ${NV0_SUPPORT_EMAIL:-ct@nv0.kr}

      NV0_ADMIN_AUTH_MODE: ${NV0_ADMIN_AUTH_MODE:-account_rbac}
      NV0_BOOTSTRAP_ADMIN_EMAIL: ${NV0_BOOTSTRAP_ADMIN_EMAIL:-admin@nv0.kr}
      NV0_BOOTSTRAP_ADMIN_PASSWORD: ${NV0_BOOTSTRAP_ADMIN_PASSWORD:-replace-with-admin-password}
      NV0_ADMIN_SESSION_TTL_MS: ${NV0_ADMIN_SESSION_TTL_MS:-3600000}
      NV0_ADMIN_IP_ALLOWLIST: ${NV0_ADMIN_IP_ALLOWLIST:-}

      NV0_ENABLE_TURNSTILE: ${NV0_ENABLE_TURNSTILE:-true}
      NV0_TURNSTILE_SITE_KEY: ${NV0_TURNSTILE_SITE_KEY:-replace-with-turnstile-site-key}
      NV0_TURNSTILE_SECRET: ${NV0_TURNSTILE_SECRET:-replace-with-turnstile-secret}

      NV0_PERSISTENCE_MODE: ${NV0_PERSISTENCE_MODE:-postgres_primary}
      NV0_DATABASE_URL: ${NV0_DATABASE_URL:-postgres://nv0:${POSTGRES_PASSWORD:-${SERVICE_PASSWORD_POSTGRES:-replace-with-postgres-password}}@postgres:5432/nv0}
      NV0_DB_COMPARE_MODE: ${NV0_DB_COMPARE_MODE:-0}

      NV0_REDIS_URL: ${NV0_REDIS_URL:-redis://redis:6379/0}
      NV0_SESSION_STORE: ${NV0_SESSION_STORE:-redis}
      NV0_RATE_LIMIT_STORE: ${NV0_RATE_LIMIT_STORE:-redis}
      NV0_LOCK_PROVIDER: ${NV0_LOCK_PROVIDER:-redis}

      NV0_STORAGE_MODE: ${NV0_STORAGE_MODE:-s3}
      NV0_S3_ENDPOINT: ${NV0_S3_ENDPOINT:-https://s3.ap-northeast-2.amazonaws.com}
      NV0_S3_BUCKET: ${NV0_S3_BUCKET:-replace-with-bucket}
      NV0_S3_REGION: ${NV0_S3_REGION:-ap-northeast-2}
      NV0_S3_ACCESS_KEY_ID: ${NV0_S3_ACCESS_KEY_ID:-replace-with-access-key}
      NV0_S3_SECRET_ACCESS_KEY: ${NV0_S3_SECRET_ACCESS_KEY:-replace-with-secret-key}
      NV0_S3_PUBLIC_BASE_URL: ${NV0_S3_PUBLIC_BASE_URL:-https://cdn.nv0.kr}

      NV0_SCAN_PROVIDER: ${NV0_SCAN_PROVIDER:-external_http}
      NV0_SCAN_PROVIDER_URL: ${NV0_SCAN_PROVIDER_URL:-https://scan.nv0.kr/api/scan}
      NV0_SCAN_PROVIDER_TOKEN: ${NV0_SCAN_PROVIDER_TOKEN:-replace-with-scan-token}
      NV0_SCAN_PROVIDER_FALLBACK: ${NV0_SCAN_PROVIDER_FALLBACK:-false}
      NV0_TARGET_FETCH_ENABLED: ${NV0_TARGET_FETCH_ENABLED:-false}

      NV0_PAYMENT_PROVIDER: ${NV0_PAYMENT_PROVIDER:-portone_v2}
      NV0_PORTONE_API_SECRET: ${NV0_PORTONE_API_SECRET:-replace-with-portone-api-secret}
      NV0_PORTONE_STORE_ID: ${NV0_PORTONE_STORE_ID:-replace-with-portone-store-id}
      NV0_PORTONE_CHANNEL_KEY: ${NV0_PORTONE_CHANNEL_KEY:-replace-with-portone-channel-key}
      NV0_PORTONE_WEBHOOK_SECRET: ${NV0_PORTONE_WEBHOOK_SECRET:-replace-with-portone-webhook-secret}
      NV0_PORTONE_WEBHOOK_VERIFY_MODE: ${NV0_PORTONE_WEBHOOK_VERIFY_MODE:-strict}

      NV0_SMTP_URL: ${NV0_SMTP_URL:-smtps://user:password@smtp.your-provider.kr:465?from=ct%40nv0.kr}
      NV0_EMAIL_MAX_RETRY_COUNT: ${NV0_EMAIL_MAX_RETRY_COUNT:-5}
      NV0_EMAIL_RETRY_BACKOFF_MS: ${NV0_EMAIL_RETRY_BACKOFF_MS:-300000}

      NV0_PUBLIC_SCAN_LIMIT: ${NV0_PUBLIC_SCAN_LIMIT:-20}
      NV0_PUBLIC_SCAN_WINDOW_MS: ${NV0_PUBLIC_SCAN_WINDOW_MS:-60000}
      NV0_ADMIN_AUTH_LIMIT: ${NV0_ADMIN_AUTH_LIMIT:-8}
      NV0_ADMIN_AUTH_WINDOW_MS: ${NV0_ADMIN_AUTH_WINDOW_MS:-600000}
      NV0_BACKUP_RETENTION_COUNT: ${NV0_BACKUP_RETENTION_COUNT:-20}
      NV0_AUDIT_LOG_RETENTION_COUNT: ${NV0_AUDIT_LOG_RETENTION_COUNT:-1000}
      NV0_PAYMENT_IDEMPOTENCY_TTL_MS: ${NV0_PAYMENT_IDEMPOTENCY_TTL_MS:-86400000}
      NV0_PUBLIC_CACHE_SECONDS: ${NV0_PUBLIC_CACHE_SECONDS:-60}
NV0_ALLOWED_HOSTS=nv0.kr,www.nv0.kr
NV0_REQUEST_TIMEOUT_MS=15000

      NV0_MAIL_ORDER_REGISTRATION_NUMBER: ${NV0_MAIL_ORDER_REGISTRATION_NUMBER:-제0000-서울중구-0000호}
      NV0_HOSTING_PROVIDER: ${NV0_HOSTING_PROVIDER:-Coolify}
      NV0_CUSTOMER_SERVICE_PHONE: ${NV0_CUSTOMER_SERVICE_PHONE:-replace-with-customer-service-phone}
      NV0_PRIVACY_OFFICER_EMAIL: ${NV0_PRIVACY_OFFICER_EMAIL:-privacy@nv0.kr}
    ports:
      - "3210:3210"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nv0}
      POSTGRES_USER: ${POSTGRES_USER:-nv0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-postgres-password}
    volumes:
      - nv0_postgres:/var/lib/postgresql/data
      - ./deploy/postgres/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nv0} -d $${POSTGRES_DB:-nv0}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nv0_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nv0_postgres:
  nv0_redis:
