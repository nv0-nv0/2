# NV0 Coolify production compose - canonical UI-detectable version
# Coolify settings:
# - Build Pack: Docker Compose
# - Base Directory: /
# - Docker Compose Location: /docker-compose.yml
# - Environment Variables: paste deploy/coolify.env.bulk.txt into Developer View, then replace placeholders.
# Every operator-facing environment variable is explicit as ${VAR} for Coolify UI autodetection.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3210}
      - NV0_RUNTIME_DIR=${NV0_RUNTIME_DIR:-/tmp/nv0-runtime}
      - NV0_FALLBACK_RUNTIME_DIR=${NV0_FALLBACK_RUNTIME_DIR:-/tmp/nv0-runtime}
      - NV0_REQUIRE_PERSISTENT_RUNTIME=${NV0_REQUIRE_PERSISTENT_RUNTIME:-auto}
      - NV0_PLATFORM_TARGET=${NV0_PLATFORM_TARGET:-commercial}
      - NV0_DEPLOYMENT_STAGE=${NV0_DEPLOYMENT_STAGE:-prelaunch}
      - NV0_COMMERCIAL_LAUNCH_READY=${NV0_COMMERCIAL_LAUNCH_READY:-false}
      - NV0_PUBLIC_BASE_URL=${NV0_PUBLIC_BASE_URL:-https://nv0.kr}
      - NV0_TRUST_PROXY_HEADERS=${NV0_TRUST_PROXY_HEADERS:-true}
      - NV0_ALLOWED_ADMIN_ORIGINS=${NV0_ALLOWED_ADMIN_ORIGINS:-nv0.kr,www.nv0.kr}
      - NV0_ALLOWED_HOSTS=${NV0_ALLOWED_HOSTS:-nv0.kr,www.nv0.kr}
      - NV0_REQUEST_TIMEOUT_MS=${NV0_REQUEST_TIMEOUT_MS:-15000}
      - NV0_SLOW_REQUEST_THRESHOLD_MS=${NV0_SLOW_REQUEST_THRESHOLD_MS:-1500}
      - NV0_MAX_JSON_BODY_BYTES=${NV0_MAX_JSON_BODY_BYTES:-1048576}
      - NV0_MAX_MULTIPART_BODY_BYTES=${NV0_MAX_MULTIPART_BODY_BYTES:-10485760}
      - NV0_SUPPORT_EMAIL=${NV0_SUPPORT_EMAIL:-ct@nv0.kr}
      - NV0_MAIL_ORDER_REGISTRATION_NUMBER=${NV0_MAIL_ORDER_REGISTRATION_NUMBER:-}
      - NV0_HOSTING_PROVIDER=${NV0_HOSTING_PROVIDER:-Coolify/Contabo}
      - NV0_CUSTOMER_SERVICE_PHONE=${NV0_CUSTOMER_SERVICE_PHONE:-이메일전용고객지원}
      - NV0_PRIVACY_OFFICER_EMAIL=${NV0_PRIVACY_OFFICER_EMAIL:-privacy@nv0.kr}
      - NV0_DATA_RETENTION_DAYS=${NV0_DATA_RETENTION_DAYS:-90}
      - NV0_DATA_DESTRUCTION_GRACE_DAYS=${NV0_DATA_DESTRUCTION_GRACE_DAYS:-30}
      - NV0_REFUND_REQUEST_WINDOW_DAYS=${NV0_REFUND_REQUEST_WINDOW_DAYS:-7}
      - NV0_RULES_VERSION=${NV0_RULES_VERSION:-production-20260427}
      - NV0_OPERATOR_ALERT_EMAIL=${NV0_OPERATOR_ALERT_EMAIL:-ct@nv0.kr}
      - NV0_ADMIN_AUTH_MODE=${NV0_ADMIN_AUTH_MODE:-account_rbac}
      - NV0_BOOTSTRAP_ADMIN_EMAIL=${NV0_BOOTSTRAP_ADMIN_EMAIL:-admin@nv0.kr}
      - NV0_BOOTSTRAP_ADMIN_NAME=${NV0_BOOTSTRAP_ADMIN_NAME:-NV0_Admin}
      - NV0_BOOTSTRAP_ADMIN_PASSWORD=${NV0_BOOTSTRAP_ADMIN_PASSWORD:?set NV0_BOOTSTRAP_ADMIN_PASSWORD in Coolify}
      - NV0_ADMIN_SESSION_TTL_MS=${NV0_ADMIN_SESSION_TTL_MS:-3600000}
      - NV0_ADMIN_IP_ALLOWLIST=${NV0_ADMIN_IP_ALLOWLIST:?set NV0_ADMIN_IP_ALLOWLIST in Coolify}
      - NV0_ENABLE_TURNSTILE=${NV0_ENABLE_TURNSTILE:-true}
      - NV0_TURNSTILE_SITE_KEY=${NV0_TURNSTILE_SITE_KEY:?set NV0_TURNSTILE_SITE_KEY in Coolify}
      - NV0_TURNSTILE_SECRET=${NV0_TURNSTILE_SECRET:?set NV0_TURNSTILE_SECRET in Coolify}
      - NV0_PERSISTENCE_MODE=${NV0_PERSISTENCE_MODE:-postgres_primary}
      - NV0_DATABASE_URL=postgres://nv0:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Coolify}@postgres:5432/nv0
      - NV0_DB_COMPARE_MODE=${NV0_DB_COMPARE_MODE:-0}
      - NV0_REDIS_URL=${NV0_REDIS_URL:-redis://redis:6379/0}
      - NV0_REDIS_TIMEOUT_MS=${NV0_REDIS_TIMEOUT_MS:-1500}
      - NV0_SESSION_STORE=${NV0_SESSION_STORE:-redis}
      - NV0_RATE_LIMIT_STORE=${NV0_RATE_LIMIT_STORE:-redis}
      - NV0_LOCK_PROVIDER=${NV0_LOCK_PROVIDER:-redis}
      - NV0_STORAGE_MODE=${NV0_STORAGE_MODE:-s3}
      - NV0_S3_ENDPOINT=${NV0_S3_ENDPOINT:?set NV0_S3_ENDPOINT in Coolify}
      - NV0_S3_BUCKET=${NV0_S3_BUCKET:?set NV0_S3_BUCKET in Coolify}
      - NV0_S3_REGION=${NV0_S3_REGION:-auto}
      - NV0_S3_ACCESS_KEY_ID=${NV0_S3_ACCESS_KEY_ID:?set NV0_S3_ACCESS_KEY_ID in Coolify}
      - NV0_S3_SECRET_ACCESS_KEY=${NV0_S3_SECRET_ACCESS_KEY:?set NV0_S3_SECRET_ACCESS_KEY in Coolify}
      - NV0_S3_PUBLIC_BASE_URL=${NV0_S3_PUBLIC_BASE_URL:-}
      - NV0_S3_FORCE_PATH_STYLE=${NV0_S3_FORCE_PATH_STYLE:-true}
      - NV0_SCAN_PROVIDER=${NV0_SCAN_PROVIDER:-external_http}
      - NV0_SCAN_PROVIDER_URL=${NV0_SCAN_PROVIDER_URL:?set NV0_SCAN_PROVIDER_URL in Coolify}
      - NV0_SCAN_PROVIDER_TOKEN=${NV0_SCAN_PROVIDER_TOKEN:-}
      - NV0_SCAN_PROVIDER_FALLBACK=${NV0_SCAN_PROVIDER_FALLBACK:-true}
      - NV0_SCAN_CACHE_TTL_MS=${NV0_SCAN_CACHE_TTL_MS:-300000}
      - NV0_TARGET_FETCH_ENABLED=${NV0_TARGET_FETCH_ENABLED:-true}
      - NV0_PAYMENT_PROVIDER=${NV0_PAYMENT_PROVIDER:-disabled}
      - NV0_PORTONE_API_BASE_URL=${NV0_PORTONE_API_BASE_URL:-https://api.portone.io}
      - NV0_PORTONE_API_SECRET=${NV0_PORTONE_API_SECRET:-}
      - NV0_PORTONE_STORE_ID=${NV0_PORTONE_STORE_ID:-}
      - NV0_PORTONE_CHANNEL_KEY=${NV0_PORTONE_CHANNEL_KEY:-}
      - NV0_PORTONE_REDIRECT_URL=${NV0_PORTONE_REDIRECT_URL:-https://nv0.kr/checkout}
      - NV0_PORTONE_PAY_METHOD=${NV0_PORTONE_PAY_METHOD:-CARD}
      - NV0_PORTONE_CUSTOMER_ID_PREFIX=${NV0_PORTONE_CUSTOMER_ID_PREFIX:-nv0}
      - NV0_PORTONE_WEBHOOK_SECRET=${NV0_PORTONE_WEBHOOK_SECRET:-}
      - NV0_PORTONE_WEBHOOK_VERIFY_MODE=${NV0_PORTONE_WEBHOOK_VERIFY_MODE:-optional}
      - NV0_SMTP_URL=${NV0_SMTP_URL:?set NV0_SMTP_URL in Coolify}
      - NV0_EMAIL_MAX_RETRY_COUNT=${NV0_EMAIL_MAX_RETRY_COUNT:-5}
      - NV0_EMAIL_RETRY_BACKOFF_MS=${NV0_EMAIL_RETRY_BACKOFF_MS:-300000}
      - NV0_PUBLIC_SCAN_LIMIT=${NV0_PUBLIC_SCAN_LIMIT:-20}
      - NV0_PUBLIC_SCAN_WINDOW_MS=${NV0_PUBLIC_SCAN_WINDOW_MS:-60000}
      - NV0_ADMIN_AUTH_LIMIT=${NV0_ADMIN_AUTH_LIMIT:-8}
      - NV0_ADMIN_AUTH_WINDOW_MS=${NV0_ADMIN_AUTH_WINDOW_MS:-600000}
      - NV0_BACKUP_RETENTION_COUNT=${NV0_BACKUP_RETENTION_COUNT:-20}
      - NV0_AUDIT_LOG_RETENTION_COUNT=${NV0_AUDIT_LOG_RETENTION_COUNT:-1000}
      - NV0_PAYMENT_IDEMPOTENCY_TTL_MS=${NV0_PAYMENT_IDEMPOTENCY_TTL_MS:-86400000}
      - NV0_PUBLIC_CACHE_SECONDS=${NV0_PUBLIC_CACHE_SECONDS:-60}
      - NV0_PUBLIC_ASSET_CACHE_SECONDS=${NV0_PUBLIC_ASSET_CACHE_SECONDS:-60}
      - NV0_READYZ_REDIS_STRICT=${NV0_READYZ_REDIS_STRICT:-false}
      - NV0_READYZ_CACHE_TTL_MS=${NV0_READYZ_CACHE_TTL_MS:-3000}
      - NV0_CORS_ALLOWED_ORIGINS=${NV0_CORS_ALLOWED_ORIGINS:-https://nv0.kr,https://www.nv0.kr}
      - NV0_JWT_TTL_SECONDS=${NV0_JWT_TTL_SECONDS:-3600}
      - NV0_CTA_AUTOPUBLISH_INTERVAL_MS=${NV0_CTA_AUTOPUBLISH_INTERVAL_MS:-1200000}
      - NV0_RUN_PREFLIGHT=${NV0_RUN_PREFLIGHT:-true}
    expose:
      - "3210"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - POSTGRES_DB=nv0
      - POSTGRES_USER=nv0
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Coolify}
    volumes:
      - nv0_postgres:/var/lib/postgresql/data
      - ./deploy/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nv0 -d nv0"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nv0_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  nv0_postgres:
  nv0_redis:
