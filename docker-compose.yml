# VERIDION Coolify boot-safe compose - phase325 no-available-server guard
# Purpose: keep nv0.kr reachable even before external PostgreSQL/Redis/S3/PortOne/SMTP keys are finalized.
# Use this root compose in Coolify first. After the site is healthy, switch to deploy/docker-compose.commercial.yml for strict commercial mode.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3210}
      NV0_RUNTIME_DIR: ${NV0_RUNTIME_DIR:-/tmp/nv0-runtime}
      NV0_FALLBACK_RUNTIME_DIR: ${NV0_FALLBACK_RUNTIME_DIR:-/tmp/nv0-runtime}
      NV0_REQUIRE_PERSISTENT_RUNTIME: ${NV0_REQUIRE_PERSISTENT_RUNTIME:-false}
      NV0_PLATFORM_TARGET: ${NV0_PLATFORM_TARGET:-mvp}
      NV0_DEPLOYMENT_STAGE: ${NV0_DEPLOYMENT_STAGE:-mvp}
      NV0_COMMERCIAL_LAUNCH_READY: ${NV0_COMMERCIAL_LAUNCH_READY:-false}
      NV0_RUN_PREFLIGHT: ${NV0_RUN_PREFLIGHT:-false}
      NV0_PUBLIC_BASE_URL: ${NV0_PUBLIC_BASE_URL:-https://nv0.kr}
      NV0_TRUST_PROXY_HEADERS: ${NV0_TRUST_PROXY_HEADERS:-true}
      NV0_ALLOWED_ADMIN_ORIGINS: ${NV0_ALLOWED_ADMIN_ORIGINS:-nv0.kr,www.nv0.kr,localhost,127.0.0.1}
      NV0_ALLOWED_HOSTS: ${NV0_ALLOWED_HOSTS:-nv0.kr,www.nv0.kr,localhost,127.0.0.1,0.0.0.0,::1}
      NV0_CANONICAL_HOST_REDIRECT: ${NV0_CANONICAL_HOST_REDIRECT:-false}
      NV0_ADMIN_AUTH_MODE: ${NV0_ADMIN_AUTH_MODE:-shared_key}
      NV0_ADMIN_KEY: ${NV0_ADMIN_KEY:-dev-admin-change-me-after-boot}
      NV0_ENABLE_TURNSTILE: ${NV0_ENABLE_TURNSTILE:-false}
      NV0_PERSISTENCE_MODE: ${NV0_PERSISTENCE_MODE:-json}
      NV0_SESSION_STORE: ${NV0_SESSION_STORE:-file}
      NV0_RATE_LIMIT_STORE: ${NV0_RATE_LIMIT_STORE:-memory}
      NV0_LOCK_PROVIDER: ${NV0_LOCK_PROVIDER:-memory}
      NV0_STORAGE_MODE: ${NV0_STORAGE_MODE:-local_fs}
      NV0_SCAN_PROVIDER: ${NV0_SCAN_PROVIDER:-builtin}
      NV0_SCAN_PROVIDER_FALLBACK: ${NV0_SCAN_PROVIDER_FALLBACK:-true}
      NV0_TARGET_FETCH_ENABLED: ${NV0_TARGET_FETCH_ENABLED:-true}
      NV0_PAYMENT_PROVIDER: ${NV0_PAYMENT_PROVIDER:-disabled}
      NV0_PORTONE_WEBHOOK_VERIFY_MODE: ${NV0_PORTONE_WEBHOOK_VERIFY_MODE:-optional}
      NV0_SUPPORT_EMAIL: ${NV0_SUPPORT_EMAIL:-ct@nv0.kr}
      NV0_PRIVACY_OFFICER_EMAIL: ${NV0_PRIVACY_OFFICER_EMAIL:-privacy@nv0.kr}
      NV0_OPERATOR_ALERT_EMAIL: ${NV0_OPERATOR_ALERT_EMAIL:-ct@nv0.kr}
      NV0_HOSTING_PROVIDER: ${NV0_HOSTING_PROVIDER:-Coolify/Contabo}
      NV0_CUSTOMER_SERVICE_PHONE: ${NV0_CUSTOMER_SERVICE_PHONE:-이메일전용고객지원}
      NV0_PUBLIC_CACHE_SECONDS: ${NV0_PUBLIC_CACHE_SECONDS:-60}
      NV0_PUBLIC_ASSET_CACHE_SECONDS: ${NV0_PUBLIC_ASSET_CACHE_SECONDS:-60}
      NV0_CTA_AUTOPUBLISH_INTERVAL_MS: ${NV0_CTA_AUTOPUBLISH_INTERVAL_MS:-1200000}
      NV0_READYZ_REDIS_STRICT: ${NV0_READYZ_REDIS_STRICT:-false}
      NV0_ACCESS_LOG_MODE: ${NV0_ACCESS_LOG_MODE:-normal}
    ports:
      - "${APP_PORT:-3210}:3210"
    expose:
      - "3210"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 45s
