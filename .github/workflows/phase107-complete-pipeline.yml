name: Phase107 Complete Pipeline Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  phase107-complete-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate complete content and connected pipeline
        run: npm run phase107:final
      - name: Validate explicit Phase107 completeness contract
        run: npm run check:phase107-complete-pipeline
