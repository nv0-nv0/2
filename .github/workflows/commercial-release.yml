name: Commercial Release Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  commercial-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate commercial release
        run: npm run validate:commercial
      - name: Run strict CI
        run: npm run ci:strict
      - name: Run release pipeline gate
        run: npm run pipeline:release
      - name: Docker build
        run: docker build -t nv0-veridion-commercial:${{ github.sha }} .
