name: Commercial Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'commercial-*'

jobs:
  commercial-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate commercial contract
        run: npm run validate:commercial
      - name: Run strict CI
        run: npm run ci:strict
      - name: Run release pipeline gate
        run: npm run pipeline:release
      - name: Build Docker image
        run: docker build -t nv0-commercial:${{ github.sha }} .
